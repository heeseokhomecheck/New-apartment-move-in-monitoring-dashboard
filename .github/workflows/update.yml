name: 주간 데이터 자동갱신

on:
  schedule:
    - cron: '0 20 * * 0'   # 매주 일요일 20:00 UTC = 월요일 새벽 5시(KST)
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests==2.32.3

      - name: 인증키 파일 생성 (GitHub Secrets에서)
        run: |
          printf '%s' "${{ secrets.SVCKEY_CHEONGYAK }}" > _apikey.txt
          printf '%s' "${{ secrets.SVCKEY_REB }}" > _rebkey.txt

      - name: 데이터 수집 + 대시보드 생성
        run: |
          python fetch_reb.py
          python fetch_ipju.py
          python fetch_cmpet.py
          python build_reb.py
          python build_data.py
          python build_proto.py

      - name: 인증키 삭제 (커밋 전 안전)
        if: always()
        run: rm -f _apikey.txt _rebkey.txt _hubkey.txt _kosis_key.txt

      - name: 변경분 커밋 & 푸시 (index.html + 경쟁률 캐시)
        run: |
          git config user.name "auto-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html cmpet_cache.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 갱신: $(date -u +%Y-%m-%d)"
            git push
          fi
